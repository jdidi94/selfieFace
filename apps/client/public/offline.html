<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Selfieface</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --fg: #1a1218;
        --muted: #6b5c66;
        --accent: #381f43;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, 'Times New Roman', serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      h1 {
        font-weight: 500;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        font-family: system-ui, sans-serif;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">You&rsquo;re offline</h1>
      <p id="body">
        Selfieface needs a connection for shopping. Check your network, then try
        again.
      </p>
      <a id="retry" href="/">Try again</a>
    </main>
    <script>
      (function () {
        var copy = {
          en: {
            title: "You're offline",
            body: 'Selfieface needs a connection for shopping. Check your network, then try again.',
            retry: 'Try again',
          },
          fr: {
            title: 'Vous êtes hors ligne',
            body: 'Selfieface a besoin d’une connexion pour faire vos achats. Vérifiez votre réseau, puis réessayez.',
            retry: 'Réessayer',
          },
          ar: {
            title: 'أنتِ غير متصلة',
            body: 'Selfieface يحتاج اتصالاً للتسوق. تحقّقي من الشبكة ثم حاولي مرة أخرى.',
            retry: 'حاولي مرة أخرى',
          },
        };
        var locale = 'en';
        try {
          var stored =
            localStorage.getItem('selfieface_locale') ||
            localStorage.getItem('lumea_locale');
          if (!stored) {
            var match =
              document.cookie.match(/(?:^|; )selfieface_locale=([^;]+)/) ||
              document.cookie.match(/(?:^|; )lumea_locale=([^;]+)/);
            if (match) stored = decodeURIComponent(match[1]);
          }
          if (stored === 'fr' || stored === 'ar' || stored === 'en') locale = stored;
        } catch (e) {}
        var t = copy[locale] || copy.en;
        document.documentElement.lang = locale;
        if (locale === 'ar') document.documentElement.dir = 'rtl';
        document.getElementById('title').textContent = t.title;
        document.getElementById('body').textContent = t.body;
        document.getElementById('retry').textContent = t.retry;
        document.title = t.title + ' · Selfieface';
      })();
    </script>
  </body>
</html>
