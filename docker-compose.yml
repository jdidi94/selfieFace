services:
  postgres:
    image: postgres:16-alpine
    container_name: lumea-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumea}
      POSTGRES_DB: ${POSTGRES_DB:-lumea}
    volumes:
      - lumea_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumea} -d ${POSTGRES_DB:-lumea}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumea_pg_data:
