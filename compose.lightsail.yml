name: lumea-test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.lightsail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lightsail}
      POSTGRES_DB: ${POSTGRES_DB:-lumea}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.lightsail
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.lightsail}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lightsail}@postgres:5432/${POSTGRES_DB:-lumea}?schema=public"
    volumes:
      - api_uploads:/app/uploads
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.lightsail}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
  caddy_data:
  caddy_config:
