# Render Blueprint — Selfieface API (native Node, no Docker)
# Existing services do NOT auto-pick this up — paste the commands into the Dashboard.
#
# If Build Command is still `npm install` / `npm run build`, deploy fails with:
#   npm error code EUNSUPPORTEDPROTOCOL
#   Unsupported URL Type "workspace:": workspace:*

services:
  - type: web
    name: selfieface-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: bash scripts/render-build-api.sh
    preDeployCommand: bash scripts/render-migrate-api.sh
    startCommand: bash scripts/render-start-api.sh
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
